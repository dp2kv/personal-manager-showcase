<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .h1   { font-size: 27px; font-weight: 700; fill: #0f172a; }
      .sub  { font-size: 15px; fill: #64748b; }
      .band { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 1.6px; }
      .name { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .desc { font-size: 13px; fill: #475569; }
      .tiny { font-size: 12px; fill: #64748b; }
      .flow { font-size: 12.5px; font-weight: 600; fill: #334155; }
      .mono { font-size: 12.5px; fill: #334155; font-family: Consolas, "Cascadia Mono", monospace; }
    </style>
  </defs>

  <rect width="1500" height="1060" fill="#ffffff"/>

  <text class="h1" x="750" y="46" text-anchor="middle">The sync engine  —  push, then pull</text>
  <text class="sub" x="750" y="74" text-anchor="middle">Upload first so the device&#x27;s own edits come back canonical in the same pass.</text>
  <text class="band" x="70" y="118" text-anchor="start">TRIGGERS</text>
  <line x1="70" y1="128" x2="1430" y2="128" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="70" y="152" width="320" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text class="name" x="230" y="182" text-anchor="middle" font-size="16">AutoSyncSchedule</text>
  <text class="desc" x="230" y="206" text-anchor="middle">every 15 minutes</text>
  <text class="tiny" x="230" y="226" text-anchor="middle">5 minute retry after a failure</text>
  <rect x="420" y="152" width="320" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text class="name" x="580" y="182" text-anchor="middle" font-size="16">Sync now</text>
  <text class="desc" x="580" y="206" text-anchor="middle">the user taps the button</text>
  <text class="tiny" x="580" y="226" text-anchor="middle">always allowed</text>
  <rect x="770" y="152" width="320" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text class="name" x="930" y="182" text-anchor="middle" font-size="16">Android WorkManager</text>
  <text class="desc" x="930" y="206" text-anchor="middle">periodic, and on leaving the foreground</text>
  <text class="tiny" x="930" y="226" text-anchor="middle">keeps syncing after the app is closed</text>
  <rect x="1120" y="152" width="310" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text class="name" x="1275" y="182" text-anchor="middle" font-size="16">Sign-out flush</text>
  <text class="desc" x="1275" y="206" text-anchor="middle">one last attempt</text>
  <text class="tiny" x="1275" y="226" text-anchor="middle">before the queue is destroyed</text>
  <path d="M 230 244 L 230 280 L 750 280 L 750 312" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-slate)"/>
  <path d="M 580 244 L 580 280 L 750 280" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-slate)"/>
  <path d="M 930 244 L 930 280 L 750 280" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-slate)"/>
  <path d="M 1275 244 L 1275 280 L 750 280" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-slate)"/>
  <rect x="430" y="312" width="640" height="92" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text class="name" x="750" y="342" text-anchor="middle">DeviceSyncRunner</text>
  <text class="desc" x="750" y="366" text-anchor="middle">captures WriteGeneration before any work starts</text>
  <text class="tiny" x="750" y="386" text-anchor="middle">so a write made mid-sync cannot be mistaken for one this sync covered</text>
  <rect x="70" y="452" width="660" height="310" rx="12" fill="#fffbf5" stroke="#fdba74" stroke-width="1.5"/>
  <text class="band" x="110" y="482" text-anchor="middle">1 · PUSH</text>
  <rect x="110" y="500" width="580" height="84" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text class="name" x="400" y="530" text-anchor="middle">FileSyncOutbox</text>
  <text class="desc" x="400" y="554" text-anchor="middle">a JSON file beside the database, not a table</text>
  <text class="tiny" x="400" y="574" text-anchor="middle">the local database is disposable; the queue must not be</text>
  <path d="M 400 584 L 400 624" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#a-orange)"/>
  <rect x="110" y="624" width="580" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="name" x="400" y="654" text-anchor="middle" font-size="15">PUSH  queued operations</text>
  <path d="M 400 674 L 400 706" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#a-orange)"/>
  <rect x="110" y="706" width="580" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="tiny" x="400" y="732" text-anchor="middle">accepted operations are removed from the queue; rejects stay for review</text>
  <path d="M 500 404 L 400 404 L 400 452" fill="none" stroke="#ea580c" stroke-width="2.6" marker-end="url(#a-orange)"/>
  <rect x="770" y="452" width="660" height="310" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text class="band" x="810" y="482" text-anchor="middle">2 · PULL</text>
  <rect x="810" y="500" width="580" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="name" x="1100" y="530" text-anchor="middle" font-size="15">PULL  changes since cursor N</text>
  <path d="M 1100 550 L 1100 586" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#a-green)"/>
  <rect x="810" y="586" width="580" height="84" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text class="name" x="1100" y="616" text-anchor="middle">SyncDeltaApplier</text>
  <text class="desc" x="1100" y="640" text-anchor="middle">applies the delta to the device copy</text>
  <text class="tiny" x="1100" y="660" text-anchor="middle">runs WITHOUT the change-log interceptor attached</text>
  <path d="M 1100 670 L 1100 706" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#a-green)"/>
  <rect x="810" y="706" width="580" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="tiny" x="1100" y="732" text-anchor="middle">FileSyncCursorStore advances to the highest Seq received</text>
  <path d="M 1000 404 L 1100 404 L 1100 452" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#a-green)"/>
  <rect x="430" y="806" width="640" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="name" x="750" y="836" text-anchor="middle">SyncChangeLog  ·  on the server</text>
  <text class="desc" x="750" y="860" text-anchor="middle">Seq · Owner · EntityType · EntityId · Operation</text>
  <text class="tiny" x="750" y="880" text-anchor="middle">written by a SaveChanges interceptor, so it catches deletes too</text>
  <path d="M 400 748 L 400 782 L 560 782 L 560 806" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#a-purple)"/>
  <path d="M 1100 748 L 1100 782 L 940 782 L 940 806" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#a-purple)"/>
  <rect x="70" y="806" width="320" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="name" x="90" y="832" text-anchor="start" font-size="15">Why Seq, not a clock</text>
  <text class="tiny" x="90" y="856" text-anchor="start">Device and server clocks drift.</text>
  <text class="tiny" x="90" y="874" text-anchor="start">A cursor built on UpdatedUtc would</text>
  <text class="tiny" x="90" y="892" text-anchor="start">skip rows or replay them forever.</text>
  <rect x="1110" y="806" width="320" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="name" x="1130" y="832" text-anchor="start" font-size="15">Then, and only then</text>
  <text class="tiny" x="1130" y="856" text-anchor="start">MarkSynced stores the generation</text>
  <text class="tiny" x="1130" y="874" text-anchor="start">captured at the start. A failed sync</text>
  <text class="tiny" x="1130" y="892" text-anchor="start">leaves the old marker untouched.</text>
  <text class="desc" x="750" y="978" text-anchor="middle">LocalCopyChanged is raised only when the pull actually brought something back —</text>
  <text class="desc" x="750" y="998" text-anchor="middle">redrawing a screen under someone&#x27;s fingers for no reason is its own kind of bug.</text>
</svg>
